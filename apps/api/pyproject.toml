[project]
name = "meetops-api"
version = "0.1.0"
description = "MeetOps FastAPI application"
requires-python = ">=3.12"
dependencies = [
    "meetops-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
    "httpx>=0.28.0",
    "boto3>=1.35.0",
    "slowapi>=0.1.9",
    "resend>=2.5.0",
    "cryptography>=44.0.0",
    "python-multipart>=0.0.20",
    "email-validator>=2.2.0",
    "patchright>=1.49.0",
]

[project.scripts]
meetops-api = "meetops_api.main:run"
meetops-cli = "meetops_api.cli:main"
meetops-worker = "meetops_api.workers.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/meetops_api"]

[tool.uv.sources]
meetops-common = { workspace = true }