# One-time bot sign-in: swaps the worker for one with noVNC on 127.0.0.1:6080.
# Usage: scripts/debug-up.sh / scripts/debug-down.sh (see README.md)
services:
  worker:
    profiles: ["disabled"]

  worker-debug:
    profiles: ["debug"]
    image: meetops/worker:local
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetops:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/meetops
      MEETOPS_DATA_DIR: /data
      MEETOPS_BOT_PROFILES_DIR: /data/chrome-profiles
      MEETOPS_BOT_X11_DISPLAY: ":99"
      MEETOPS_DEBUG_NOVNC: "1"
      MEETOPS_USE_TAB_CAPTURE_AUTO_ACCEPT: "true"   # debug convenience (detection tradeoff)
    restart: "no"
    volumes:
      - ./data:/data
    shm_size: "2gb"
    ports:
      - "127.0.0.1:6080:6080"
    depends_on:
      api:
        condition: service_healthy
    entrypoint: ["/app/scripts/entrypoint-worker-debug.sh"]
