name: Docker Images

on:
  pull_request:
    paths:
      - ".github/workflows/docker-images.yml"
      - "apps/backend/**"
      - "apps/frontend/**"
      - "packages/proto/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "docker-compose.yml"
      - ".dockerignore"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/docker-images.yml"
      - "apps/backend/**"
      - "apps/frontend/**"
      - "packages/proto/**"
      - "package.json"
      - "bun.lock"
      - "turbo.json"
      - "docker-compose.yml"
      - ".dockerignore"
  workflow_dispatch:

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
  BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'ai-meeting-notetaker-rs/backend' }}
  BACKEND_DEBUG_REPOSITORY: ${{ vars.ECR_BACKEND_DEBUG_REPOSITORY || 'ai-meeting-notetaker-rs/backend-debug' }}
  FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || 'ai-meeting-notetaker-rs/frontend' }}
  ECR_PULL_THROUGH_PREFIX: ${{ vars.ECR_PULL_THROUGH_PREFIX || 'docker-hub' }}
  CARGO_CHEF_DIGEST: sha256:fa7281503a177bd5af6261f4041ca6b36d9f0de8d3090886c33cbd8e65b88ca9
  DEBIAN_BOOKWORM_SLIM_DIGEST: sha256:0104b334637a5f19aa9c983a91b54c89887c0984081f2068983107a6f6c21eeb
  BUN_1_DIGEST: sha256:e10577f0db68676a7024391c6e5cb4b879ebd17188ab750cf10024a6d700e5c4
  CADDY_2_ALPINE_DIGEST: sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
  BUILDX_CACHE_DIR: /tmp/.buildx-cache

jobs:
  build:
    name: Build Docker images
    runs-on:
      - codebuild-AI_Notetaker_RS_Builder-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          should_push=true
          echo "short_sha=${short_sha}" >> "${GITHUB_OUTPUT}"
          echo "should_push=${should_push}" >> "${GITHUB_OUTPUT}"
          {
            echo "backend_tags<<EOF"
            if [ "${should_push}" = "true" ]; then
              echo "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:${short_sha}"
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                echo "${ECR_REGISTRY}/${BACKEND_REPOSITORY}:latest"
              fi
            else
              echo "ai-meeting-notetaker-rs-backend:${short_sha}"
            fi
            echo "EOF"

            echo "backend_debug_tags<<EOF"
            if [ "${should_push}" = "true" ]; then
              echo "${ECR_REGISTRY}/${BACKEND_DEBUG_REPOSITORY}:${short_sha}"
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                echo "${ECR_REGISTRY}/${BACKEND_DEBUG_REPOSITORY}:latest"
              fi
            else
              echo "ai-meeting-notetaker-rs-backend-debug:${short_sha}"
            fi
            echo "EOF"

            echo "frontend_tags<<EOF"
            if [ "${should_push}" = "true" ]; then
              echo "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:${short_sha}"
              if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
                echo "${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:latest"
              fi
            else
              echo "ai-meeting-notetaker-rs-frontend:${short_sha}"
            fi
            echo "EOF"

            echo "backend_cache_from<<EOF"
            echo "type=local,src=${BUILDX_CACHE_DIR}/backend"
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${BACKEND_REPOSITORY}:buildcache"
            fi
            echo "EOF"

            echo "backend_debug_cache_from<<EOF"
            echo "type=local,src=${BUILDX_CACHE_DIR}/backend-debug"
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${BACKEND_DEBUG_REPOSITORY}:buildcache"
            fi
            echo "EOF"

            echo "frontend_cache_from<<EOF"
            echo "type=local,src=${BUILDX_CACHE_DIR}/frontend"
            if [ -n "${ECR_REGISTRY}" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:buildcache"
            fi
            echo "EOF"

            echo "backend_cache_to<<EOF"
            echo "type=local,dest=${BUILDX_CACHE_DIR}/backend-new,mode=max"
            if [ "${should_push}" = "true" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${BACKEND_REPOSITORY}:buildcache,mode=max"
            fi
            echo "EOF"

            echo "backend_debug_cache_to<<EOF"
            echo "type=local,dest=${BUILDX_CACHE_DIR}/backend-debug-new,mode=max"
            if [ "${should_push}" = "true" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${BACKEND_DEBUG_REPOSITORY}:buildcache,mode=max"
            fi
            echo "EOF"

            echo "frontend_cache_to<<EOF"
            echo "type=local,dest=${BUILDX_CACHE_DIR}/frontend-new,mode=max"
            if [ "${should_push}" = "true" ]; then
              echo "type=registry,ref=${ECR_REGISTRY}/${FRONTEND_REPOSITORY}:buildcache,mode=max"
            fi
            echo "EOF"

            echo "backend_build_args<<EOF"
            echo "CARGO_CHEF_IMAGE=${ECR_REGISTRY}/${ECR_PULL_THROUGH_PREFIX}/lukemathwalker/cargo-chef@${CARGO_CHEF_DIGEST}"
            echo "DEBIAN_IMAGE=${ECR_REGISTRY}/${ECR_PULL_THROUGH_PREFIX}/library/debian@${DEBIAN_BOOKWORM_SLIM_DIGEST}"
            echo "EOF"

            echo "frontend_build_args<<EOF"
            echo "BUN_IMAGE=${ECR_REGISTRY}/${ECR_PULL_THROUGH_PREFIX}/oven/bun@${BUN_1_DIGEST}"
            echo "CADDY_IMAGE=${ECR_REGISTRY}/${ECR_PULL_THROUGH_PREFIX}/library/caddy@${CADDY_2_ALPINE_DIGEST}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate ECR configuration
        if: ${{ steps.meta.outputs.should_push == 'true' && env.ECR_REGISTRY == '' }}
        shell: bash
        run: |
          echo "ECR_REGISTRY repository variable is required when pushing images" >&2
          exit 1

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: runtime
          push: ${{ steps.meta.outputs.should_push }}
          tags: ${{ steps.meta.outputs.backend_tags }}
          build-args: ${{ steps.meta.outputs.backend_build_args }}
          cache-from: ${{ steps.meta.outputs.backend_cache_from }}
          cache-to: ${{ steps.meta.outputs.backend_cache_to }}

      - name: Build backend debug image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          target: debug
          push: ${{ steps.meta.outputs.should_push }}
          tags: ${{ steps.meta.outputs.backend_debug_tags }}
          build-args: ${{ steps.meta.outputs.backend_build_args }}
          cache-from: ${{ steps.meta.outputs.backend_debug_cache_from }}
          cache-to: ${{ steps.meta.outputs.backend_debug_cache_to }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          push: ${{ steps.meta.outputs.should_push }}
          tags: ${{ steps.meta.outputs.frontend_tags }}
          build-args: ${{ steps.meta.outputs.frontend_build_args }}
          cache-from: ${{ steps.meta.outputs.frontend_cache_from }}
          cache-to: ${{ steps.meta.outputs.frontend_cache_to }}

      - name: Rotate Buildx local cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${BUILDX_CACHE_DIR}/backend" "${BUILDX_CACHE_DIR}/backend-debug" "${BUILDX_CACHE_DIR}/frontend"
          if [ -d "${BUILDX_CACHE_DIR}/backend-new" ]; then
            mv "${BUILDX_CACHE_DIR}/backend-new" "${BUILDX_CACHE_DIR}/backend"
          fi
          if [ -d "${BUILDX_CACHE_DIR}/backend-debug-new" ]; then
            mv "${BUILDX_CACHE_DIR}/backend-debug-new" "${BUILDX_CACHE_DIR}/backend-debug"
          fi
          if [ -d "${BUILDX_CACHE_DIR}/frontend-new" ]; then
            mv "${BUILDX_CACHE_DIR}/frontend-new" "${BUILDX_CACHE_DIR}/frontend"
          fi
