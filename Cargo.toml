[package]
name = "google-meeting-recorder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "find-chrome-tab-allow-click"
path = "src/bin/find_chrome_tab_allow_click.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
chromiumoxide = "0.9"
dotenvy = "0.15"
figment = { version = "0.10", features = ["env", "toml"] }
futures = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros"] }
thiserror = "1"
tokio = { version = "1", features = ["fs", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.5", features = ["compression-full", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
urlencoding = "2"
