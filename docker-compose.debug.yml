# Debug / bootstrap: noVNC for Google bot sign-in on :6080
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.debug.yml --profile debug up --build
#
# Opens: web :3000, api :8000, noVNC :6080
# Uses worker-debug instead of the regular worker.

services:
  worker:
    profiles: ["disabled"]

  worker-debug:
    profiles: ["debug"]
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://meetops:meetops@postgres:5432/meetops
      MEETOPS_DATA_DIR: /data
      MEETOPS_BOT_PROFILES_DIR: /data/chrome-profiles
      MEETOPS_BOT_X11_DISPLAY: ":99"
      MEETOPS_DEBUG_NOVNC: "1"
      # Debug convenience: skip native Allow sheet (document detection tradeoff)
      MEETOPS_USE_TAB_CAPTURE_AUTO_ACCEPT: "true"
    volumes:
      - ./data:/data
    shm_size: "2gb"
    ports:
      - "6080:6080"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    entrypoint: ["/app/scripts/entrypoint-worker-debug.sh"]
