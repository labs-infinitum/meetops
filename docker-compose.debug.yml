services:
  backend:
    build:
      target: debug
    env_file:
      - path: apps/backend/.env
        required: false
      - path: debug.env
        required: false
    environment:
      GMR_BOT__X11_DISPLAY: ":99"
      GMR_BOT__X11_AUTO_VIRTUAL: "false"
      DEBUG_X11_DISPLAY: ":99"
      DEBUG_RUN_SERVER_ON_NO_COMMAND: "true"
    stdin_open: true
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
