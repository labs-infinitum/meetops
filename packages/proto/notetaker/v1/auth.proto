syntax = "proto3";

package notetaker.v1;

// Auth API for the web frontend (grpc-web).
service AuthService {
  rpc SignUp(SignUpRequest) returns (AuthResponse);
  rpc Login(LoginRequest) returns (AuthResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc GetSession(GetSessionRequest) returns (AuthResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (AuthMessageResponse);
  rpc ResetPassword(ResetPasswordRequest) returns (AuthMessageResponse);
  rpc VerifyEmail(VerifyEmailRequest) returns (AuthResponse);
  rpc ResendVerificationEmail(ResendVerificationEmailRequest) returns (AuthMessageResponse);
}

message SignUpRequest {
  string name = 1;
  string email = 2;
  string username = 3;
  string password = 4;
}

message LoginRequest {
  string username = 1;
  string password = 2;
}

message LogoutRequest {
  string token = 1;
}

message GetSessionRequest {
  string token = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message VerifyEmailRequest {
  string token = 1;
}

message ResendVerificationEmailRequest {
  string email = 1;
}

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  string username = 4;
  bool email_verified = 5;
}

message AuthSuccess {
  User user = 1;
  string token = 2;
  int64 expires_at = 3;
  bool email_verification_required = 4;
}

message AuthError {
  string code = 1;
  string message = 2;
}

message AuthResponse {
  oneof result {
    AuthSuccess success = 1;
    AuthError error = 2;
  }
}

message AuthMessageSuccess {
  string message = 1;
}

message AuthMessageResponse {
  oneof result {
    AuthMessageSuccess success = 1;
    AuthError error = 2;
  }
}

message LogoutResponse {
  bool ok = 1;
}
