syntax = "proto3";

package notetaker.v1;

service RecordingService {
  rpc ListBotRuns(ListBotRunsRequest) returns (ListBotRunsResponse);
  rpc GetBotRun(GetBotRunRequest) returns (GetBotRunResponse);
  rpc GetPlaybackUrl(GetPlaybackUrlRequest) returns (GetPlaybackUrlResponse);
  rpc ListMeetingTimelineEvents(ListMeetingTimelineEventsRequest) returns (ListMeetingTimelineEventsResponse);
  rpc StartAdHocRecording(StartAdHocRecordingRequest) returns (StartAdHocRecordingResponse);
  rpc StopRecording(StopRecordingRequest) returns (StopRecordingResponse);
}

message ListBotRunsRequest {
  string token = 1;
  int32 limit = 2;
}

message BotRun {
  int64 id = 1;
  string meeting_id = 2;
  string meeting_title = 3;
  string status = 4;
  string error = 5;
  int64 meeting_start_at = 6;
  int64 started_at = 7;
  int64 ended_at = 8;
  int64 created_at = 9;
  string recording_path = 10;
  int64 duration_secs = 11;
}

message ListBotRunsResponse {
  oneof result {
    ListBotRunsSuccess success = 1;
    RecordingError error = 2;
  }
}

message ListBotRunsSuccess {
  repeated BotRun runs = 1;
}

message GetBotRunRequest {
  string token = 1;
  int64 run_id = 2;
}

message GetBotRunResponse {
  oneof result {
    BotRun success = 1;
    RecordingError error = 2;
  }
}

message GetPlaybackUrlRequest {
  string token = 1;
  int64 run_id = 2;
}

message GetPlaybackUrlResponse {
  oneof result {
    PlaybackUrlSuccess success = 1;
    RecordingError error = 2;
  }
}

message PlaybackUrlSuccess {
  string url = 1;
  int64 expires_at = 2;
}

message MeetingTimelineEvent {
  int64 id = 1;
  int64 bot_run_id = 2;
  string event_type = 3;
  int64 occurred_at = 4;
  int64 relative_ms = 5;
  string participant_id = 6;
  string participant_name = 7;
  string payload_json = 8;
  int64 created_at = 9;
}

message ListMeetingTimelineEventsRequest {
  string token = 1;
  int64 run_id = 2;
  int32 limit = 3;
}

message ListMeetingTimelineEventsResponse {
  oneof result {
    ListMeetingTimelineEventsSuccess success = 1;
    RecordingError error = 2;
  }
}

message ListMeetingTimelineEventsSuccess {
  repeated MeetingTimelineEvent events = 1;
}

message RecordingError {
  string code = 1;
  string message = 2;
}

message StartAdHocRecordingRequest {
  string token = 1;
  string meet_url = 2;
}

message StartAdHocRecordingResponse {
  oneof result {
    StartAdHocRecordingSuccess success = 1;
    RecordingError error = 2;
  }
}

message StartAdHocRecordingSuccess {
  int64 run_id = 1;
  BotRun run = 2;
}

message StopRecordingRequest {
  string token = 1;
  int64 run_id = 2;
}

message StopRecordingResponse {
  oneof result {
    StopRecordingSuccess success = 1;
    RecordingError error = 2;
  }
}

message StopRecordingSuccess {}
