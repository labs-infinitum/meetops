syntax = "proto3";

package notetaker.v1;

// Calendar connection API for the web frontend (grpc-web).
service CalendarService {
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc StartOAuth(StartOAuthRequest) returns (StartOAuthResponse);
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);
  rpc SyncNow(SyncNowRequest) returns (SyncNowResponse);
}

message ListConnectionsRequest {
  string token = 1;
}

message CalendarConnection {
  string id = 1;
  string provider = 2;
  string email = 3;
  string label = 4;
  string color = 5;
  bool connected = 6;
  int64 last_synced_at = 7;
  int32 meeting_count = 8;
}

message ListConnectionsResponse {
  oneof result {
    ListConnectionsSuccess success = 1;
    CalendarError error = 2;
  }
}

message ListConnectionsSuccess {
  repeated CalendarConnection connections = 1;
}

message StartOAuthRequest {
  string token = 1;
  string provider = 2;
  string label = 3;
  string color = 4;
}

message StartOAuthResponse {
  oneof result {
    StartOAuthSuccess success = 1;
    CalendarError error = 2;
  }
}

message StartOAuthSuccess {
  string redirect_url = 1;
}

message DisconnectRequest {
  string token = 1;
  string connection_id = 2;
}

message DisconnectResponse {
  oneof result {
    DisconnectSuccess success = 1;
    CalendarError error = 2;
  }
}

message DisconnectSuccess {
  bool ok = 1;
}

message SyncNowRequest {
  string token = 1;
  string connection_id = 2;
}

message SyncNowResponse {
  oneof result {
    SyncNowSuccess success = 1;
    CalendarError error = 2;
  }
}

message SyncNowSuccess {
  int32 seen = 1;
  int32 upserted = 2;
  int32 deleted = 3;
  int64 last_synced_at = 4;
}

message CalendarError {
  string code = 1;
  string message = 2;
  string email = 3;
  string provider = 4;
  string other_account_hint = 5;
}
