# Pull pre-built images from ECR (no local Docker build).
# Mirrors docker-compose.yml — swap `build:` for `image:`.
#
#   aws ecr get-login-password --region us-east-1 \
#     | docker login --username AWS --password-stdin 656555178734.dkr.ecr.us-east-1.amazonaws.com
#
#   docker compose -f docker-compose.ecr.yml pull
#   docker compose -f docker-compose.ecr.yml up -d
#
# Debug profile (requires backend-debug image in ECR):
#   docker compose -f docker-compose.ecr.yml --profile debug run --rm backend-debug profile

services:
  backend:
    platform: linux/amd64
    image: 656555178734.dkr.ecr.us-east-1.amazonaws.com/ai-meeting-notetaker-rs/backend:${IMAGE_TAG:-latest}
    container_name: notetaker-backend
    env_file:
      - path: apps/backend/.env
        required: false
    environment:
      GMR_SERVER__HOST: 0.0.0.0
      GMR_GRPC__HOST: 0.0.0.0
      GMR_STORAGE__DATA_DIR: /data
      GMR_BOT__CHROMIUM_PATH: /usr/bin/google-chrome-stable
      GMR_BOT__CHROME_USER_DATA_DIR: /data/chrome-profile
      GMR_GRPC__ALLOW_ORIGIN: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}
      GMR_GOOGLE__REDIRECT_URI: ${PUBLIC_OAUTH_CALLBACK_URL:-http://localhost:8080/auth/google/callback}
      GMR_GOOGLE__FRONTEND_REDIRECT_URL: ${PUBLIC_FRONTEND_URL:-http://localhost:3000}/app/calendars
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    volumes:
      - ./data:/data
    shm_size: "2gb"
    restart: unless-stopped

  frontend:
    image: 656555178734.dkr.ecr.us-east-1.amazonaws.com/ai-meeting-notetaker-rs/frontend:${IMAGE_TAG:-latest}
    container_name: notetaker-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    restart: unless-stopped

  # Remote desktop into the bot's Xvfb display (:99) via RustDesk — for profile sign-in and debugging.
  backend-debug:
    profiles: ["debug"]
    platform: linux/amd64
    image: 656555178734.dkr.ecr.us-east-1.amazonaws.com/ai-meeting-notetaker-rs/backend-debug:${DEBUG_IMAGE_TAG:-${IMAGE_TAG:-latest}}
    container_name: notetaker-backend-debug
    env_file:
      - path: apps/backend/.env
        required: false
      - path: debug.env
        required: false
    environment:
      GMR_STORAGE__DATA_DIR: /data
      GMR_BOT__CHROMIUM_PATH: /usr/bin/google-chrome-stable
      GMR_BOT__CHROME_USER_DATA_DIR: /data/chrome-profile
      GMR_BOT__X11_DISPLAY: ":99"
      GMR_BOT__X11_AUTO_VIRTUAL: "false"
      DEBUG_X11_DISPLAY: ":99"
      # RUSTDESK_* and DEBUG_WAIT_SECS come from debug.env — do not override here with
      # ${VAR:-} or Compose will blank them when the repo-root .env lacks those keys.
    volumes:
      - ./data:/data
    shm_size: "2gb"
    stdin_open: true
    tty: true
